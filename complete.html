<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Complete ELEs | ELE Activity Bank</title>
<meta name="description" content="The complete TCEA Essential Learning Expectations in one document — raw markdown alongside a rendered view.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  .mdv-head{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem;padding:1rem clamp(1rem,4vw,2rem) .5rem}
  .mdv-head h1{font-size:1.35rem;margin:0;flex:1 1 auto}
  .mdv-actions{display:flex;gap:.5rem;flex-wrap:wrap}
  .mdv-btn{font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;border-radius:8px;padding:.45rem .8rem;border:1.5px solid var(--navy);background:var(--white);color:var(--navy);text-decoration:none;line-height:1;display:inline-flex;align-items:center}
  .mdv-btn:hover{background:var(--navy);color:var(--white)}
  .mdv-btn.is-ok{background:var(--gold);border-color:var(--gold);color:var(--navy-dark)}
  .mdv-split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border);height:calc(100vh - 5rem);min-height:480px}
  .mdv-pane{background:var(--white);overflow:auto;padding:0}
  .mdv-pane-label{position:sticky;top:0;z-index:2;background:var(--off-white);border-bottom:1px solid var(--border);padding:.4rem clamp(.75rem,2vw,1.25rem);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
  .mdv-raw{margin:0;padding:1rem clamp(.75rem,2vw,1.25rem);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text);tab-size:2}
  .mdv-rendered{padding:1rem clamp(.75rem,2.5vw,1.75rem) 3rem;color:var(--text)}
  .mdv-rendered h1{font-size:1.6rem;margin:.2em 0 .5em}
  .mdv-rendered h1:first-child{margin-top:0}
  .mdv-rendered h2{font-size:1.3rem;margin:1.4em 0 .4em;padding-top:.6em;border-top:2px solid var(--border)}
  .mdv-rendered h3{font-size:1.05rem;margin:1.1em 0 .3em}
  .mdv-rendered p,.mdv-rendered li{line-height:1.6}
  .mdv-rendered table{border-collapse:collapse;width:100%;margin:.75em 0;font-size:.85rem}
  .mdv-rendered th,.mdv-rendered td{border:1px solid var(--border);padding:.5rem .6rem;text-align:left;vertical-align:top}
  .mdv-rendered thead th{background:var(--pale-navy);color:var(--navy-dark)}
  .mdv-rendered tbody tr:nth-child(even){background:var(--off-white)}
  .mdv-rendered blockquote{margin:.75em 0;padding:.4em 1em;border-left:4px solid var(--gold);background:var(--gold-pale);color:var(--text)}
  .mdv-rendered code{background:var(--off-white);padding:.1em .3em;border-radius:4px;font-size:.9em}
  .mdv-rendered hr{border:0;border-top:1px solid var(--border);margin:1.5em 0}
  .mdv-rendered a{color:var(--navy-mid)}
  .mdv-status{padding:2rem clamp(.75rem,2vw,1.25rem);color:var(--text-muted)}
  @media (max-width:900px){
    .mdv-split{grid-template-columns:1fr;height:auto}
    .mdv-pane{height:70vh}
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">ELE</span><span>Activity Bank</span></a>
  <nav aria-label="Main">
    <a href="framework.html">&larr; Back to the ELEs</a>
  </nav>
</header>

<main id="main">
  <div class="mdv-head">
    <h1>The Complete ELEs</h1>
    <div class="mdv-actions">
      <button type="button" class="mdv-btn" id="copyBtn">Copy markdown</button>
      <button type="button" class="mdv-btn" id="copyRichBtn" title="Copy the rendered version to paste into Google Docs, Word, email, etc.">Copy formatted</button>
      <a class="mdv-btn" id="dlBtn" href="TCEA_ELEs_Complete.md" download>Download .md</a>
    </div>
  </div>
  <div class="mdv-split">
    <section class="mdv-pane" aria-label="Markdown source">
      <div class="mdv-pane-label">Markdown source</div>
      <pre class="mdv-raw" id="raw"><span class="mdv-status">Loading…</span></pre>
    </section>
    <section class="mdv-pane" aria-label="Rendered">
      <div class="mdv-pane-label">Rendered</div>
      <div class="mdv-rendered" id="rendered"><p class="mdv-status">Loading…</p></div>
    </section>
  </div>
</main>

<script>
(function(){
  var MD='TCEA_ELEs_Complete.md';
  var rawEl=document.getElementById('raw');
  var renderedEl=document.getElementById('rendered');
  var copyBtn=document.getElementById('copyBtn');
  var source='';
  fetch(MD,{cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(text){
    source=text;
    rawEl.textContent=text;
    if(window.marked){
      marked.setOptions({gfm:true,breaks:false});
      renderedEl.innerHTML=marked.parse(text);
    }else{
      renderedEl.innerHTML='<p class="mdv-status">Could not load the markdown renderer. The source is shown on the left.</p>';
    }
  }).catch(function(err){
    var msg='Could not load '+MD+' ('+err.message+'). If you opened this file directly from disk, view it through a web server (or on the published site) so the browser can fetch the markdown.';
    rawEl.innerHTML='<span class="mdv-status">'+msg+'</span>';
    renderedEl.innerHTML='<p class="mdv-status">'+msg+'</p>';
  });
  function flash(btn,msg){var o=btn.textContent;btn.textContent=msg||'Copied!';btn.classList.add('is-ok');setTimeout(function(){btn.textContent=o;btn.classList.remove('is-ok')},1500)}
  function selectCopy(node){var sel=window.getSelection();var r=document.createRange();r.selectNodeContents(node);sel.removeAllRanges();sel.addRange(r);var ok=false;try{ok=document.execCommand('copy')}catch(e){}sel.removeAllRanges();return ok}

  copyBtn.addEventListener('click',function(){
    if(!source) return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(source).then(function(){flash(copyBtn)},function(){selectCopy(rawEl);flash(copyBtn)});
    }else{selectCopy(rawEl);flash(copyBtn)}
  });

  var copyRichBtn=document.getElementById('copyRichBtn');
  copyRichBtn.addEventListener('click',function(){
    if(!source) return;
    var html=renderedEl.innerHTML, plain=renderedEl.innerText;
    if(navigator.clipboard&&window.ClipboardItem){
      try{
        var item=new ClipboardItem({
          'text/html':new Blob([html],{type:'text/html'}),
          'text/plain':new Blob([plain],{type:'text/plain'})
        });
        navigator.clipboard.write([item]).then(function(){flash(copyRichBtn)},function(){selectCopy(renderedEl);flash(copyRichBtn)});
      }catch(e){selectCopy(renderedEl);flash(copyRichBtn)}
    }else{
      // execCommand on a selected rendered range copies rich text in most browsers
      selectCopy(renderedEl);flash(copyRichBtn);
    }
  });
})();
</script>
</body>
</html>
